<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1033"/>
      <stop offset="55%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <g id="cloud" filter="url(#soft)">
      <ellipse cx="70" cy="44" rx="70" ry="16"/>
      <circle cx="40" cy="30" r="22"/>
      <circle cx="78" cy="22" r="28"/>
      <circle cx="112" cy="34" r="19"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="900" height="220" fill="url(#sky)"/>

  <!-- twinkling stars -->
  <g fill="#f5d0fe">
    <circle cx="60" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="55" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="22" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="40" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="25" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="70" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- back clouds (slow, faint) -->
  <g fill="#e9d5ff" opacity="0.18">
    <g transform="translate(0,20) scale(1.3)">
      <use xlink:href="#cloud"><animateTransform attributeName="transform" type="translate" from="-250 0" to="750 0" dur="70s" begin="-20s" repeatCount="indefinite"/></use>
    </g>
    <g transform="translate(0,120) scale(1.5)">
      <use xlink:href="#cloud"><animateTransform attributeName="transform" type="translate" from="-250 0" to="650 0" dur="85s" begin="-55s" repeatCount="indefinite"/></use>
    </g>
  </g>

  <!-- front clouds (faster, brighter) -->
  <g fill="#f5d0fe" opacity="0.32">
    <g transform="translate(0,85) scale(0.9)">
      <use xlink:href="#cloud"><animateTransform attributeName="transform" type="translate" from="-200 0" to="1100 0" dur="45s" begin="-10s" repeatCount="indefinite"/></use>
    </g>
    <g transform="translate(0,150) scale(0.7)">
      <use xlink:href="#cloud"><animateTransform attributeName="transform" type="translate" from="-200 0" to="1300 0" dur="55s" begin="-38s" repeatCount="indefinite"/></use>
    </g>
  </g>

  <!-- text -->
  <text x="450" y="95" text-anchor="middle" font-family="'Fira Code','Courier New',monospace" font-size="38" font-weight="bold" fill="#f5d0fe">&gt; hello_world();</text>
  <text x="450" y="135" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="16" letter-spacing="2" fill="#e9d5ff">HI THERE! 👋 I'M DENNISE ELIEZA</text>
</svg>
